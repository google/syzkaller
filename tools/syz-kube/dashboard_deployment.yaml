apiVersion: apps/v1
kind: Deployment
metadata:
  name: syz-dashboard
  namespace: syzkube
  labels:
    app.kubernetes.io/name: syz-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syz-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syz-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
      - name: dashboard
        image: gcr.io/syzkaller/env
        workingDir: /syzkaller
        command:
        - sh
        - -c
        - |
          export SPANNER_EMULATOR_HOST=cloud-spanner-emulator.syzkube.svc.cluster.local:9010
          export STORAGE_EMULATOR_HOST=http://fake-gcs-server.syzkube.svc.cluster.local:4443
          echo "Starting Syzkaller Cluster Dashboard..."
          go test -run TestLocalUI -timeout=0 -v /syzkaller/dashboard/app -local-ui -local-ui-addr=0.0.0.0:8080
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: workspace
          mountPath: /syzkaller
      volumes:
      - name: workspace
        hostPath:
          path: /projects/syzkaller
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: syz-dashboard
  namespace: syzkube
  labels:
    app.kubernetes.io/name: syz-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: syz-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
