apiVersion: apps/v1
kind: Deployment
metadata:
  name: syz-dashboard
  namespace: syzkube
  labels:
    app.kubernetes.io/name: syz-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syz-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syz-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
      - name: dashboard
        image: gcr.io/syzkaller/env
        workingDir: /syzkaller
        command:
        - sh
        - -c
        - |
          export SPANNER_EMULATOR_HOST=cloud-spanner-emulator.syzkube.svc.cluster.local:9010
          export STORAGE_EMULATOR_HOST=http://fake-gcs-server.syzkube.svc.cluster.local:4443
          export GOOGLE_CLOUD_SPANNER_MULTIPLEXED_SESSIONS=false
          git config --global --add safe.directory '*'
          export GOFLAGS="-buildvcs=false"
          echo "Starting Syzkaller Dashboard via dev_appserver..."
          /usr/local/google-cloud-sdk/bin/dev_appserver.py \
            --application=syzkaller \
            --host=0.0.0.0 \
            --port=8080 \
            --admin_host=0.0.0.0 \
            --admin_port=8000 \
            --enable_host_checking=false \
            --clear_datastore=true \
            --datastore_consistency_policy=consistent \
            /syzkaller/dashboard/app/app.yaml
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8000
          name: admin
        volumeMounts:
        - name: workspace
          mountPath: /syzkaller
      volumes:
      - name: workspace
        hostPath:
          path: /projects/syzkaller
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: syz-dashboard
  namespace: syzkube
  labels:
    app.kubernetes.io/name: syz-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: syz-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
