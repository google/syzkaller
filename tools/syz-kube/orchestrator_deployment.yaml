apiVersion: apps/v1
kind: Deployment
metadata:
  name: syz-orchestrator
  namespace: syzkube
  labels:
    app.kubernetes.io/name: syz-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syz-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syz-orchestrator
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: syz-orchestrator
      containers:
      - name: orchestrator
        image: gcr.io/syzkaller/env
        workingDir: /syzkaller
        command:
        - sh
        - -c
        - |
          echo "Starting Syzkaller Kubernetes Orchestrator..."
          go run /syzkaller/tools/syz-kube/orchestrator -namespace=syzkube -action=list
          # Keep container running in daemon mode
          exec sleep infinity
        volumeMounts:
        - name: workspace
          mountPath: /syzkaller
      volumes:
      - name: workspace
        hostPath:
          path: /projects/syzkaller
          type: Directory
