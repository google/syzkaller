apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: triage-action-template
spec:
  templates:
    - name: triage-action
      retryStrategy:
        limit: "3"
        backoff:
          duration: "5m"
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: setup-repo
          image: ${IMAGE_PREFIX}triage-action:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              git clone --shared -c remote.origin.fetch="+refs/heads/*:refs/heads/*" /kernel-repo /workdir
              git -C /workdir commit-graph write --reachable
              chown -R syzkaller:syzkaller /workdir
          env:
            - name: GIT_DISCOVERY_ACROSS_FILESYSTEM
              value: "1"
            - name: HOME
              value: "/home/syzkaller"
          volumeMounts:
            - name: base-kernel-repo
              mountPath: /kernel-repo
              readOnly: true
            - name: workdir
              mountPath: /workdir
      container:
          image: ${IMAGE_PREFIX}triage-action:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["/bin/triage-action"]
          args: [
            "--session", "{{workflow.parameters.session-id}}",
            "--repository", "/workdir",
            "--verdict", "/output/result.json"
            ]
          resources:
            requests:
              cpu: 1
              memory: 8G
            limits:
              cpu: 4
              memory: 16G
          env:
            - name: GIT_DISCOVERY_ACROSS_FILESYSTEM
              value: "1"
            - name: HOME # Otherwise it's failing with "warning: unable to access '/root/.config/git/attributes': Permission denied.".
              value: "/home/syzkaller"
          volumeMounts:
            - name: base-kernel-repo
              mountPath: /kernel-repo
              readOnly: true
            - name: workdir
              mountPath: /workdir
            - name: output
              mountPath: /output
            - name: aflow-cache
              mountPath: /tmp/aflow-cache
            - name: config-volume
              mountPath: /config
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"] # Needed for osutil.Sandbox namespaces (CLONE_NEWNET, CLONE_NEWNS, CLONE_NEWPID).
      volumes:
        - name: base-kernel-repo
          persistentVolumeClaim:
            claimName: base-kernel-repo-pv-claim
        - name: workdir
          emptyDir: {}
        - name: output
          emptyDir: {}
        - name: aflow-cache
          emptyDir: {}
        - name: config-volume
          configMap:
            name: global-config
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /output/result.json
