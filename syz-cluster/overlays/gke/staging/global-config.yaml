URL: http://unknown
parallelWorkflows: 5
loreArchives:
  - netdev
  - linux-ext4
  - syzbot
directList: syzbot@lists.linux.dev
aiConfig:
  geminiAPIKey: "gcp-secret:syz-cluster-gemini-key"
trees:
  - name: net
    URL: https://kernel.googlesource.com/pub/scm/linux/kernel/git/netdev/net.git
    branch: main
    email_lists:
      - netdev@vger.kernel.org
  - name: torvalds
    URL: https://kernel.googlesource.com/pub/scm/linux/kernel/git/torvalds/linux
    branch: master
  - name: linux-next
    URL: https://kernel.googlesource.com/pub/scm/linux/kernel/git/next/linux-next
    branch: master
fuzz_targets:
  - email_lists:
      - netdev@vger.kernel.org
    path_regexps:
      - "^net/|^drivers/net/|include/net/"
    focus: net
    corpus_url: https://storage.googleapis.com/syzkaller/corpus/ci-upstream-net-kasan-gce-corpus.db
    campaigns:
      - track: KASAN
        kernel_config: upstream-apparmor-kasan.config
  - email_lists:
      - linux-ext4@vger.kernel.org
    path_regexps:
      - "^fs/|^block/|drivers/block"
    focus: fs
    corpus_url: https://storage.googleapis.com/syzkaller/corpus/ci2-upstream-fs-corpus.db
    campaigns:
      - track: KASAN
        kernel_config: upstream-apparmor-kasan.config
  - corpus_url: https://storage.googleapis.com/syzkaller/corpus/ci-upstream-kasan-gce-root-corpus.db
    campaigns:
      - track: KASAN
        kernel_config: upstream-apparmor-kasan.config
