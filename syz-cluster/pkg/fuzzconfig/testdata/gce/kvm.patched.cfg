{
	"name": "patched",
	"target": "linux/amd64",
	"kernel_obj": "/patched/obj",
	"image": "/patched/image",
	"procs": 3,
	"fuzzing_vms": 3,
	"enable_syscalls": [
		"openat$kvm",
		"openat$sev",
		"close",
		"ioctl$KVM*",
		"syz_kvm*",
		"mmap$KVM_VCPU",
		"munmap",
		"syz_memcpy_off$KVM_EXIT_MMIO",
		"syz_memcpy_off$KVM_EXIT_HYPERCALL",
		"eventfd2",
		"write$eventfd"
	],
	"type": "gce",
	"vm": {
		"auto_delete_image": true,
		"count": 9,
		"gcs_path": "syzkaller/disks",
		"kernel": "/patched/kernel",
		"machine_type": "n2-standard-2"
	},
	"Experimental": {
		"cover_edges": false
	}
}