{
	"name": "patched",
	"target": "linux/amd64",
	"kernel_obj": "/patched/obj",
	"image": "/patched/image",
	"procs": 3,
	"fuzzing_vms": 3,
	"disable_syscalls": [
		"syz_mount_image$hfs",
		"syz_mount_image$gfs*",
		"perf_event_open*",
		"ioctl$PERF*",
		"bpf$BPF_RAW_TRACEPOINT_OPEN"
	],
	"type": "gce",
	"vm": {
		"auto_delete_image": true,
		"count": 9,
		"gcs_path": "syzkaller/disks",
		"kernel": "/patched/kernel",
		"machine_type": "e2-standard-2"
	},
	"Experimental": {
		"cover_edges": false
	}
}