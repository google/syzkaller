{
	"name": "base",
	"target": "linux/amd64",
	"image": "/base/image",
	"procs": 3,
	"disable_syscalls": [
		"syz_mount_image$hfs",
		"syz_mount_image$gfs*",
		"perf_event_open*",
		"ioctl$PERF*",
		"bpf$BPF_RAW_TRACEPOINT_OPEN"
	],
	"type": "gce",
	"vm": {
		"count": 3,
		"machine_type": "e2-standard-2",
		"gcs_path": "syzkaller/disks",
		"auto_delete_image": true
	},
	"Experimental": {
		"cover_edges": false
	}
}