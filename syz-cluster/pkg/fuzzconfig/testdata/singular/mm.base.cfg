{
	"name": "base",
	"target": "linux/amd64",
	"http": "",
	"rpc": ":0",
	"workdir": "/workdir",
	"kernel_obj": "/base/obj",
	"kernel_build_src": "/workdir",
	"android_split_build": false,
	"image": "/base/image",
	"ssh_user": "root",
	"syzkaller": "/syzkaller",
	"procs": 3,
	"max_crash_logs": 100,
	"sandbox": "none",
	"required_test_capabilities": null,
	"sandbox_arg": 0,
	"snapshot": false,
	"cover": true,
	"raw_cover": false,
	"reproduce": true,
	"preserve_corpus": true,
	"enable_syscalls": [
		"mmap",
		"munmap",
		"mremap",
		"remap_file_pages",
		"mprotect",
		"msync",
		"madvise",
		"process_madvise",
		"process_mrelease",
		"fadvise64",
		"readahead",
		"mincore",
		"mlock",
		"mlock2",
		"munlock",
		"mlockall",
		"munlockall",
		"brk",
		"membarrier",
		"pkey_alloc",
		"pkey_free",
		"pkey_mprotect",
		"syz_pkey_set",
		"process_vm_readv",
		"process_vm_writev",
		"ptrace",
		"memfd_create",
		"memfd_secret",
		"shmget",
		"shmat",
		"shmctl",
		"shmdt",
		"fallocate",
		"ftruncate",
		"truncate",
		"cachestat",
		"open",
		"openat",
		"creat",
		"close",
		"read",
		"write",
		"pread64",
		"pwrite64",
		"readv",
		"writev",
		"preadv",
		"pwritev",
		"preadv2",
		"pwritev2",
		"lseek",
		"dup",
		"dup2",
		"dup3",
		"splice",
		"vmsplice",
		"tee",
		"sendfile",
		"copy_file_range",
		"fcntl",
		"mount",
		"umount2",
		"fsopen",
		"fsconfig",
		"fsmount",
		"move_mount",
		"userfaultfd",
		"ioctl$UFFDIO*",
		"syz_open_procfs",
		"ioctl$PAGEMAP_SCAN",
		"mbind",
		"set_mempolicy",
		"set_mempolicy_home_node",
		"get_mempolicy",
		"move_pages",
		"migrate_pages",
		"swapon",
		"swapoff",
		"syz_open_dev$loop",
		"ioctl$LOOP*",
		"ioctl$BLK*",
		"mkdirat$cgroup*",
		"clock_gettime",
		"clone",
		"clone3",
		"unshare",
		"setns",
		"exit",
		"exit_group",
		"wait4",
		"waitid"
	],
	"strace_bin": "",
	"strace_bin_on_target": false,
	"execprog_bin_on_target": "",
	"executor_bin_on_target": "",
	"run_fsck": true,
	"type": "qemu",
	"vm": {
		"count": 3,
		"cmdline": "root=/dev/sda1",
		"kernel": "/base/kernel",
		"cpu": 2,
		"mem": 7168,
		"qemu_args": "-machine q35 -enable-kvm -smp 2,sockets=2,cores=1"
	},
	"asset_storage": null,
	"memory_dump": false,
	"Experimental": {
		"reset_acc_state": false,
		"remote_cover": true,
		"cover_edges": false,
		"descriptions_mode": "manual",
		"enable_kfuzztest": false
	}
}