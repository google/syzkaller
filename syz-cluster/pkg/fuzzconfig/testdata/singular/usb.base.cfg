{
	"name": "base",
	"target": "linux/amd64",
	"http": "",
	"rpc": ":0",
	"workdir": "/workdir",
	"kernel_obj": "/base/obj",
	"kernel_build_src": "/workdir",
	"android_split_build": false,
	"image": "/base/image",
	"ssh_user": "root",
	"syzkaller": "/syzkaller",
	"procs": 3,
	"max_crash_logs": 100,
	"sandbox": "none",
	"required_test_capabilities": null,
	"sandbox_arg": 0,
	"snapshot": false,
	"cover": true,
	"raw_cover": false,
	"reproduce": true,
	"preserve_corpus": true,
	"enable_syscalls": [
		"syz_usb_connect",
		"syz_usb_connect_ath9k",
		"syz_usb_disconnect",
		"syz_usb_control_io",
		"syz_usb_ep_write",
		"syz_usb_ep_read",
		"syz_open_dev$char_usb",
		"read$char_usb",
		"write$char_usb",
		"syz_open_dev$hidraw",
		"write$hidraw",
		"read$hidraw",
		"syz_open_dev$hiddev",
		"read$hiddev",
		"ioctl$HIDIO*",
		"syz_open_dev$evdev",
		"write$evdev",
		"ioctl$EVIO*"
	],
	"strace_bin": "",
	"strace_bin_on_target": false,
	"execprog_bin_on_target": "",
	"executor_bin_on_target": "",
	"run_fsck": true,
	"type": "qemu",
	"vm": {
		"count": 3,
		"cmdline": "root=/dev/sda1",
		"kernel": "/base/kernel",
		"cpu": 2,
		"mem": 7168,
		"qemu_args": "-machine q35 -enable-kvm -smp 2,sockets=2,cores=1"
	},
	"asset_storage": null,
	"memory_dump": false,
	"Experimental": {
		"reset_acc_state": false,
		"remote_cover": true,
		"cover_edges": false,
		"descriptions_mode": "manual",
		"enable_kfuzztest": false
	}
}