{
	"name": "base",
	"target": "linux/amd64",
	"http": "",
	"rpc": ":0",
	"workdir": "/workdir",
	"kernel_obj": "/base/obj",
	"kernel_build_src": "/workdir",
	"android_split_build": false,
	"image": "/base/image",
	"ssh_user": "root",
	"syzkaller": "/syzkaller",
	"procs": 3,
	"max_crash_logs": 100,
	"sandbox": "none",
	"required_test_capabilities": null,
	"sandbox_arg": 0,
	"snapshot": false,
	"cover": true,
	"raw_cover": false,
	"reproduce": true,
	"preserve_corpus": true,
	"enable_syscalls": [
		"syz_emit_vhci",
		"syz_init_net_socket$bt*",
		"bind$bt*",
		"connect$bt*",
		"accept4$bt*",
		"setsockopt$bt*",
		"getsockopt$bt*",
		"ioctl$sock_bt*",
		"ioctl$HCI*",
		"write$bt*",
		"openat$6lowpan*",
		"write$6lowpan*",
		"openat$rfkill",
		"write$rfkill",
		"read$rfkill",
		"ioctl$RFKILL*",
		"accept",
		"accept4",
		"bind",
		"close",
		"connect",
		"epoll_create",
		"epoll_create1",
		"epoll_ctl",
		"epoll_pwait",
		"epoll_wait",
		"getpeername",
		"getsockname",
		"getsockopt",
		"ioctl$sock_*",
		"listen",
		"poll",
		"ppoll",
		"pselect6",
		"read",
		"readv",
		"recvfrom",
		"recvmmsg",
		"recvmsg",
		"select",
		"sendmmsg",
		"sendmsg",
		"sendto",
		"setsockopt",
		"shutdown",
		"socket",
		"write",
		"writev",
		"clock_gettime"
	],
	"strace_bin": "",
	"strace_bin_on_target": false,
	"execprog_bin_on_target": "",
	"executor_bin_on_target": "",
	"run_fsck": true,
	"type": "qemu",
	"vm": {
		"count": 3,
		"cmdline": "root=/dev/sda1",
		"kernel": "/base/kernel",
		"cpu": 2,
		"mem": 7168,
		"qemu_args": "-machine q35 -enable-kvm -smp 2,sockets=2,cores=1"
	},
	"asset_storage": null,
	"memory_dump": false,
	"Experimental": {
		"reset_acc_state": false,
		"remote_cover": true,
		"cover_edges": false,
		"descriptions_mode": "manual",
		"enable_kfuzztest": false
	}
}